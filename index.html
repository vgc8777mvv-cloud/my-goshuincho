
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイ御朱印帳</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f5f0;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
header{background:#8b3e35;color:white;padding:25px 20px 22px}
header h1{margin:0;font-size:25px}
header p{margin:8px 0 0;font-size:13px;opacity:.9}
main{padding:16px;max-width:700px;margin:auto}
.panel{background:white;border-radius:16px;padding:17px;margin-bottom:16px;box-shadow:0 2px 9px #0000000c}
h2{font-size:18px;margin:0 0 15px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;background:#fff}
textarea{min-height:80px;resize:vertical}
button{border:0;border-radius:10px;padding:13px 16px;font-size:16px;font-weight:600;cursor:pointer}
.primary{background:#8b3e35;color:white;width:100%;margin-top:15px}
.photoPreview{max-width:100%;max-height:220px;display:block;margin-top:10px;border-radius:10px}
.stats{display:flex;gap:10px}
.stat{flex:1;background:#f5ece8;border-radius:12px;padding:13px;text-align:center}
.stat strong{font-size:22px;display:block;color:#8b3e35}
.stat span{font-size:12px}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
.toolbar input{flex:1}
.card{border:1px solid #eee;border-radius:13px;padding:12px;margin-top:12px}
.card img{width:100%;max-height:240px;object-fit:contain;border-radius:10px;background:#fafafa}
.card h3{margin:10px 0 5px}
.meta{color:#777;font-size:13px}
.note{white-space:pre-wrap;font-size:14px}
.delete{background:#eee;color:#555;padding:8px 12px;font-size:13px;margin-top:8px}
.empty{text-align:center;color:#888;padding:20px}
footer{text-align:center;color:#999;font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
<h1>⛩️ マイ御朱印帳</h1>
<p>大切な参拝の記録を残そう</p>
</header>
<main>
<section class="panel">
<div class="stats">
<div class="stat"><strong id="total">0</strong><span>登録御朱印</span></div>
<div class="stat"><strong id="places">0</strong><span>訪問先</span></div>
</div>
</section>

<section class="panel">
<h2>＋ 御朱印を登録</h2>
<label>神社・寺院名 *</label>
<input id="name" placeholder="例：明治神宮">
<label>参拝日</label>
<input id="date" type="date">
<label>都道府県</label>
<input id="pref" placeholder="例：東京都">
<label>御朱印の写真</label>
<input id="photo" type="file" accept="image/*">
<img id="preview" class="photoPreview" style="display:none">
<label>メモ</label>
<textarea id="memo" placeholder="参拝の思い出、由緒など"></textarea>
<button class="primary" id="save">御朱印を保存する</button>
</section>

<section class="panel">
<h2>📖 御朱印コレクション</h2>
<div class="toolbar">
<input id="search" placeholder="神社名・地域で検索">
</div>
<div id="list"></div>
</section>
</main>
<footer>マイ御朱印帳 ・ 自分専用記録</footer>

<script>
let records=JSON.parse(localStorage.getItem("goshuinRecords")||"[]");
let photoData="";
const photoInput=document.getElementById("photo");
photoInput.addEventListener("change",()=>{
 const file=photoInput.files[0];
 if(!file){photoData="";return}
 const reader=new FileReader();
 reader.onload=e=>{
  photoData=e.target.result;
  const p=document.getElementById("preview");
  p.src=photoData;p.style.display="block";
 };
 reader.readAsDataURL(file);
});

document.getElementById("save").addEventListener("click",()=>{
 const name=document.getElementById("name").value.trim();
 if(!name){alert("神社・寺院名を入力してください");return}
 records.unshift({
  id:Date.now(),
  name,
  date:document.getElementById("date").value,
  pref:document.getElementById("pref").value.trim(),
  photo:photoData,
  memo:document.getElementById("memo").value.trim()
 });
 localStorage.setItem("goshuinRecords",JSON.stringify(records));
 document.getElementById("name").value="";
 document.getElementById("date").value="";
 document.getElementById("pref").value="";
 document.getElementById("memo").value="";
 photoInput.value="";
 photoData="";
 document.getElementById("preview").style.display="none";
 render();
 alert("御朱印を保存しました！");
});

document.getElementById("search").addEventListener("input",render);

function render(){
 document.getElementById("total").textContent=records.length;
 document.getElementById("places").textContent=new Set(records.map(r=>r.name)).size;
 const q=document.getElementById("search").value.toLowerCase();
 const filtered=records.filter(r=>(r.name+" "+r.pref+" "+r.memo).toLowerCase().includes(q));
 const list=document.getElementById("list");
 if(!filtered.length){
  list.innerHTML='<div class="empty">まだ御朱印がありません。<br>上から登録してみましょう。</div>';
  return;
 }
 list.innerHTML=filtered.map(r=>`
 <div class="card">
 ${r.photo?`<img src="${r.photo}" alt="御朱印写真">`:""}
 <h3>${escapeHtml(r.name)}</h3>
 <div class="meta">${escapeHtml(r.date||"参拝日未登録")} ${r.pref?"・"+escapeHtml(r.pref):""}</div>
 ${r.memo?`<p class="note">${escapeHtml(r.memo)}</p>`:""}
 <button class="delete" onclick="removeRecord(${r.id})">削除</button>
 </div>`).join("");
}
function removeRecord(id){
 if(!confirm("この御朱印を削除しますか？"))return;
 records=records.filter(r=>r.id!==id);
 localStorage.setItem("goshuinRecords",JSON.stringify(records));
 render();
}
function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
render();
</script>
</body>
</html>
